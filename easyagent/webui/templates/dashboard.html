<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EasyAgent 控制台</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/dashboard.css') }}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
</head>
<body>
    <nav class="navbar navbar-dark bg-primary">
        <div class="container-fluid">
            <span class="navbar-brand mb-0 h1">
                <i class="bi bi-robot"></i> EasyAgent 控制台
            </span>
            <span class="navbar-text" id="system-status">
                <span class="badge bg-success">运行中</span>
            </span>
        </div>
    </nav>

    <div class="container-fluid mt-4">
        <div class="row">
            <!-- 左侧边栏 -->
            <div class="col-md-3">
                <!-- 系统监控 -->
                <div class="card mb-3">
                    <div class="card-header">
                        <i class="bi bi-speedometer2"></i> 系统监控
                    </div>
                    <div class="card-body">
                        <div class="mb-3">
                            <label class="form-label">CPU 使用率</label>
                            <div class="progress">
                                <div id="cpu-progress" class="progress-bar" role="progressbar" style="width: 0%"></div>
                            </div>
                            <small id="cpu-value" class="text-muted">0%</small>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">内存使用</label>
                            <div class="progress">
                                <div id="memory-progress" class="progress-bar bg-info" role="progressbar" style="width: 0%"></div>
                            </div>
                            <small id="memory-value" class="text-muted">0%</small>
                        </div>
                    </div>
                </div>

                <!-- 快速操作 -->
                <div class="card mb-3">
                    <div class="card-header">
                        <i class="bi bi-lightning"></i> 快速操作
                    </div>
                    <div class="card-body">
                        <button class="btn btn-primary btn-sm w-100 mb-2" data-bs-toggle="modal" data-bs-target="#createAgentModal">
                            <i class="bi bi-plus-circle"></i> 创建 Agent
                        </button>
                        <button class="btn btn-outline-secondary btn-sm w-100 mb-2" onclick="refreshAll()">
                            <i class="bi bi-arrow-clockwise"></i> 刷新全部
                        </button>
                        <button class="btn btn-outline-danger btn-sm w-100" onclick="clearAllData()">
                            <i class="bi bi-trash"></i> 清空数据
                        </button>
                    </div>
                </div>

                <!-- 可用工具 -->
                <div class="card mb-3">
                    <div class="card-header">
                        <i class="bi bi-tools"></i> 可用工具
                    </div>
                    <div class="card-body p-0">
                        <ul id="tools-list" class="list-group list-group-flush">
                            <li class="list-group-item text-muted">加载中...</li>
                        </ul>
                    </div>
                </div>
            </div>

            <!-- 右侧内容 -->
            <div class="col-md-9">
                <!-- Agent 列表 -->
                <div class="card mb-3">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <span><i class="bi bi-robot"></i> Agent 列表</span>
                        <button class="btn btn-sm btn-outline-primary" onclick="loadAgents()">
                            <i class="bi bi-arrow-clockwise"></i> 刷新
                        </button>
                    </div>
                    <div class="card-body">
                        <table class="table table-hover" id="agent-table">
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>类型</th>
                                    <th>模型</th>
                                    <th>状态</th>
                                    <th>创建时间</th>
                                    <th>操作</th>
                                </tr>
                            </thead>
                            <tbody id="agent-tbody">
                                <tr>
                                    <td colspan="6" class="text-center text-muted">暂无 Agent</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>

                <!-- 对话面板 -->
                <div class="card mb-3">
                    <div class="card-header">
                        <i class="bi bi-chat-dots"></i> 对话
                    </div>
                    <div class="card-body">
                        <div id="chat-container" class="chat-container mb-3">
                            <div class="text-muted text-center py-4">
                                选择一个 Agent 开始对话
                            </div>
                        </div>
                        <div class="input-group">
                            <input type="text" id="chat-input" class="form-control" placeholder="输入消息..." disabled>
                            <button class="btn btn-primary" id="send-btn" onclick="sendMessage()" disabled>
                                <i class="bi bi-send"></i> 发送
                            </button>
                        </div>
                    </div>
                </div>

                <!-- 模型配置 -->
                <div class="card mb-3">
                    <div class="card-header">
                        <i class="bi bi-gear"></i> 模型配置
                    </div>
                    <div class="card-body">
                        <form id="model-config-form" class="row g-3">
                            <div class="col-md-4">
                                <label class="form-label">模型</label>
                                <select id="model-select" class="form-select">
                                    <option value="gpt-4">GPT-4</option>
                                    <option value="gpt-3.5-turbo">GPT-3.5 Turbo</option>
                                </select>
                            </div>
                            <div class="col-md-3">
                                <label class="form-label">Temperature</label>
                                <input type="number" id="temperature-input" class="form-control" value="0.7" min="0" max="2" step="0.1">
                            </div>
                            <div class="col-md-3">
                                <label class="form-label">Max Tokens</label>
                                <input type="number" id="max-tokens-input" class="form-control" value="150" min="1" max="4096">
                            </div>
                            <div class="col-md-2 d-flex align-items-end">
                                <button type="button" class="btn btn-success" onclick="updateModelConfig()">
                                    <i class="bi bi-check2"></i> 应用
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 创建 Agent Modal -->
    <div class="modal fade" id="createAgentModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">创建新 Agent</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label class="form-label">Agent ID</label>
                        <input type="text" id="new-agent-id" class="form-control" placeholder="my-agent">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Agent 类型</label>
                        <select id="new-agent-type" class="form-select">
                            <option value="ChatAgent">ChatAgent</option>
                            <option value="SearchAgent">SearchAgent</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">模型</label>
                        <select id="new-agent-model" class="form-select">
                            <option value="gpt-4">GPT-4</option>
                            <option value="gpt-3.5-turbo">GPT-3.5 Turbo</option>
                        </select>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                    <button type="button" class="btn btn-primary" onclick="createAgent()">创建</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Toast 通知 -->
    <div class="toast-container position-fixed bottom-0 end-0 p-3">
        <div id="toast" class="toast" role="alert">
            <div class="toast-header">
                <strong class="me-auto" id="toast-title">通知</strong>
                <button type="button" class="btn-close" data-bs-dismiss="toast"></button>
            </div>
            <div class="toast-body" id="toast-message"></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='js/dashboard.js') }}"></script>
</body>
</html>
