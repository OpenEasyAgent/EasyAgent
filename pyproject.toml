[build-system]
requires = ["setuptools>=42.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "easy-agent"
version = "0.1.0"
description = "快速构建你的AI Agent"
readme = "README.md"
authors = [{name = "OpenEasyAgent"}]
license = {file = "LICENSE"}
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
requires-python = ">=3.8"
dependencies = [
    "openai>=1.0.0",
    "flask>=3.0.0",
    "requests>=2.31.0",
    "psutil>=5.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.21.0",
]

[project.urls]
"Homepage" = "https://github.com/GlowLED/easyagent"
"Bug Tracker" = "https://github.com/GlowLED/easyagent/issues"

[tool.setuptools]
packages = ["easyagent"]

# 可选：测试配置
[tool.pytest]
testpaths = ["tests"]
